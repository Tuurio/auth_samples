name: Distribution catalog

on:
  pull_request:
    paths:
      - ".github/workflows/distribution-catalog.yml"
      - "distribution/**"
      - "auth_samples_*/.github/social-preview.*"
      - "ai_saas_starter/.github/social-preview.png"
      - "LICENSE"
      - "README.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/distribution-catalog.yml"
      - "distribution/**"
      - "auth_samples_*/.github/social-preview.*"
      - "ai_saas_starter/.github/social-preview.png"
      - "LICENSE"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: distribution-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: distribution
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: distribution/package-lock.json

      - name: Install validator dependencies
        run: npm ci

      - name: Validate catalog
        run: npm run validate

      - name: Check social previews are reproducible
        run: npm run previews && git diff --exit-code -- ../auth_samples_*/.github/social-preview.svg

      - name: Audit validator dependencies
        run: npm audit --audit-level=moderate
